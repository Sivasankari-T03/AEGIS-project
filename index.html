<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS - Conversational AI with 3D Motion</title>
  <link rel="icon" href="data:,">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <header class="border-b border-slate-800 p-4 bg-slate-950/50 backdrop-blur">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
        AEGIS Conversational Engine
      </h1>
      <span class="text-xs text-slate-400 font-mono">Status: Ready</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
    
    <!-- Left Column: API Key & Chat Input -->
    <section class="lg:col-span-1 space-y-4">
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4">
        <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Gemini API Key</label>
        <input id="api-key-input" type="password" placeholder="Paste AI Studio Key (AIzaSy...) Here..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-xs focus:outline-none focus:border-blue-500 text-slate-100">
      </div>

      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4">
        <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Ask Anything</label>
        <div class="relative flex items-center">
          <input id="query-input" type="text" placeholder="Ask a question or request a demo..." 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 pl-3 pr-10 text-sm focus:outline-none focus:border-blue-500 text-slate-100">
          <button id="mic-btn" title="Voice Input" class="absolute right-2 text-slate-400 hover:text-slate-200">
            🎤
          </button>
        </div>
        <button id="analyze-btn" class="w-full mt-3 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-sm transition">
          Ask AI Engine
        </button>
      </div>

      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">AI Response</h2>
        <div id="analysis-summary" class="text-sm text-slate-300 space-y-1">
          <p class="text-slate-500 italic">Enter your question above to receive an open-ended response.</p>
        </div>
      </div>
    </section>

    <!-- Right Column: 3D Visualization Canvas & Code Output -->
    <section class="lg:col-span-2 space-y-4">
      <div class="bg-slate-950 border border-slate-800 rounded-xl h-80 relative overflow-hidden flex items-center justify-center">
        <div id="canvas-container" class="absolute inset-0"></div>
        <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded border border-slate-800 text-[11px] font-mono text-slate-400">
          Dynamic 3D Agent Demonstrator
        </div>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Engine Log / Code Context</span>
        </div>
        <pre class="bg-slate-900/80 p-3 rounded-lg overflow-x-auto text-xs font-mono text-blue-300 border border-slate-800/80"><code id="code-view">// Execution data will appear here...</code></pre>
      </div>
    </section>

  </main>

  <script>
    /* =========================================================================
       1. Enhanced Realistic Three.js Scene & Smooth Motion Interpolation
       ========================================================================= */
    let scene, camera, renderer, agentGroup, outerRing, innerRing, trailParticles, targetMarker;
    let splineCurve = null;
    let animationProgress = 0;
    let isAnimating = false;
    const trailPositions = [];
    const MAX_TRAIL_POINTS = 50;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.03);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 14, 18);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Lighting Setup
      const ambientLight = new THREE.AmbientLight(0x1e293b, 1.5);
      scene.add(ambientLight);

      const mainSpot = new THREE.SpotLight(0x38bdf8, 3);
      mainSpot.position.set(0, 20, 10);
      mainSpot.angle = Math.PI / 4;
      mainSpot.penumbra = 0.8;
      scene.add(mainSpot);

      const secondaryLight = new THREE.PointLight(0x2dd4bf, 2, 30);
      secondaryLight.position.set(-10, -5, -10);
      scene.add(secondaryLight);

      // Grid Base
      const gridHelper = new THREE.GridHelper(24, 24, 0x0284c7, 0x1e293b);
      gridHelper.position.y = -0.01;
      scene.add(gridHelper);

      // Agent Group Setup
      agentGroup = new THREE.Group();

      // Glowing Glass Core
      const coreGeo = new THREE.IcosahedronGeometry(0.5, 3);
      const coreMat = new THREE.MeshPhysicalMaterial({
        color: 0x38bdf8,
        emissive: 0x0284c7,
        emissiveIntensity: 0.8,
        roughness: 0.1,
        metalness: 0.1,
        clearcoat: 1.0,
        clearcoatRoughness: 0.1
      });
      const coreMesh = new THREE.Mesh(coreGeo, coreMat);

      // Outer & Inner Gyro Rings
      const ringGeo1 = new THREE.TorusGeometry(0.85, 0.03, 16, 100);
      const ringMat1 = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.8, roughness: 0.2 });
      outerRing = new THREE.Mesh(ringGeo1, ringMat1);

      const ringGeo2 = new THREE.TorusGeometry(0.68, 0.02, 16, 100);
      const ringMat2 = new THREE.MeshStandardMaterial({ color: 0x2dd4bf, metalness: 0.9, roughness: 0.1 });
      innerRing = new THREE.Mesh(ringGeo2, ringMat2);

      agentGroup.add(coreMesh);
      agentGroup.add(outerRing);
      agentGroup.add(innerRing);
      agentGroup.position.set(0, 0.6, 0);
      scene.add(agentGroup);

      // Motion Trail Particles
      const trailGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(MAX_TRAIL_POINTS * 3);
      trailGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      
      const trailMat = new THREE.PointsMaterial({
        color: 0x38bdf8,
        size: 0.15,
        transparent: true,
        opacity: 0.6,
        blending: THREE.AdditiveBlending
      });
      trailParticles = new THREE.Points(trailGeo, trailMat);
      scene.add(trailParticles);

      // Target Waypoint Pulse Marker
      const targetGeo = new THREE.RingGeometry(0.3, 0.45, 32);
      const targetMat = new THREE.MeshBasicMaterial({ color: 0x2dd4bf, side: THREE.DoubleSide, transparent: true, opacity: 0 });
      targetMarker = new THREE.Mesh(targetGeo, targetMat);
      targetMarker.rotation.x = Math.PI / 2;
      scene.add(targetMarker);

      // Resize Handler
      window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
      });

      function animate() {
        requestAnimationFrame(animate);

        // Continuous local rotations
        if (agentGroup) {
          outerRing.rotation.x += 0.02;
          outerRing.rotation.y += 0.03;
          innerRing.rotation.y -= 0.04;
          innerRing.rotation.z += 0.02;
          coreMesh.rotation.y += 0.01;
        }

        // Realistic Spline Trajectory Motion
        if (isAnimating && splineCurve) {
          animationProgress += 0.0035; // Motion speed
          if (animationProgress > 1) {
            animationProgress = 1;
            isAnimating = false;
            targetMarker.material.opacity = 0;
          }

          // Fetch smooth point along curve
          const point = splineCurve.getPointAt(animationProgress);
          const tangent = splineCurve.getTangentAt(animationProgress);

          agentGroup.position.copy(point);
          
          // Realistic banking/orientation towards directional vector
          const lookAtTarget = point.clone().add(tangent);
          agentGroup.lookAt(lookAtTarget);

          // Update Pulse Target Marker position
          const endPoint = splineCurve.getPointAt(1);
          targetMarker.position.set(endPoint.x, 0.05, endPoint.z);
          targetMarker.material.opacity = 0.4 + Math.sin(Date.now() * 0.008) * 0.3;

          // Trail Updates
          trailPositions.unshift(point.clone());
          if (trailPositions.length > MAX_TRAIL_POINTS) trailPositions.pop();

          const posArr = trailParticles.geometry.attributes.position.array;
          for (let i = 0; i < trailPositions.length; i++) {
            posArr[i * 3] = trailPositions[i].x;
            posArr[i * 3 + 1] = trailPositions[i].y;
            posArr[i * 3 + 2] = trailPositions[i].z;
          }
          trailParticles.geometry.attributes.position.needsUpdate = true;
        }

        renderer.render(scene, camera);
      }
      animate();
    }

    /* =========================================================================
       2. Gemini API Call with Valid Gemini Endpoints
       ========================================================================= */
    async function processQuery(queryText) {
      const apiKey = document.getElementById('api-key-input').value.trim();
      const summaryContainer = document.getElementById('analysis-summary');
      const codeView = document.getElementById('code-view');

      if (!queryText.trim()) return;

      if (!apiKey) {
        summaryContainer.innerHTML = `<p class="text-red-400 font-semibold">Please enter your API key first.</p>`;
        return;
      }

      summaryContainer.innerHTML = `<p class="text-blue-400 animate-pulse">Analyzing algorithm & computing path...</p>`;

      const systemPrompt = `You are an AI assistant capable of explaining algorithms and spatial concepts. 
Respond in strict JSON matching this schema:
{
  "algorithm": "Name of the algorithm/pattern represented by the animation (e.g., A* Search, Binary Tree Traversal, Spiral Interpolation)",
  "answer": "Concise text explanation of the response",
  "codeSnippet": "Code snippet or pseudocode for the algorithm",
  "path3D": [
    {"x": number, "y": 0.6, "z": number}
  ]
}
For path3D, provide 5 to 10 spatial coordinates bounded within x: -8 to 8, z: -8 to 8 that visually depict the behavior of the named algorithm.`;

      // Corrected production model endpoints for Gemini v1beta
      const models = ['gemini-1.5-flash', 'gemini-1.5-pro'];
      let responseData = null;

      for (let i = 0; i < models.length; i++) {
        const currentModel = models[i];
        try {
          if (i > 0) {
            summaryContainer.innerHTML = `<p class="text-amber-400 animate-pulse">Switching to fallback model (${currentModel})...</p>`;
          }

          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${apiKey}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{
                parts: [{ text: `${systemPrompt}\n\nUser Query: ${queryText}` }]
              }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await response.json();

          if (data.error) {
            throw new Error(data.error.message);
          }

          responseData = data;
          break;

        } catch (err) {
          console.warn(`Model ${currentModel} failed:`, err.message);
          
          if (i === models.length - 1) {
            summaryContainer.innerHTML = `<p class="text-red-400 font-semibold">Error across all endpoints: ${err.message}</p>`;
            return;
          }
        }
      }

      try {
        const rawText = responseData.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(rawText);

        summaryContainer.innerHTML = `
          <div class="mb-2 p-2 bg-blue-950/60 border border-blue-800/80 rounded-lg">
            <span class="text-[10px] uppercase font-bold text-blue-400 block tracking-wider">Active Animation Algorithm</span>
            <span class="text-xs font-semibold text-teal-300">${parsed.algorithm || "Custom Trajectory Path"}</span>
          </div>
          <p class="text-slate-200 text-xs leading-relaxed">${parsed.answer}</p>
        `;

        codeView.innerText = parsed.codeSnippet || "// No algorithmic code provided.";

        // Construct Smooth Curve Spline from Path Waypoints
        if (parsed.path3D && Array.isArray(parsed.path3D) && parsed.path3D.length > 1) {
          const curvePoints = parsed.path3D.map(p => new THREE.Vector3(p.x, p.y || 0.6, p.z));
          splineCurve = new THREE.CatmullRomCurve3(curvePoints, false, 'centripetal');
          animationProgress = 0;
          isAnimating = true;
          trailPositions.length = 0;
        }

      } catch (err) {
        summaryContainer.innerHTML = `<p class="text-red-400 font-semibold">Error parsing response data.</p>`;
      }
    }

    /* =========================================================================
       3. Event Listeners
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      init3D();

      document.getElementById('analyze-btn').addEventListener('click', () => {
        const query = document.getElementById('query-input').value;
        processQuery(query);
      });

      document.getElementById('query-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          processQuery(e.target.value);
        }
      });

      const micBtn = document.getElementById('mic-btn');
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        micBtn.addEventListener('click', () => {
          recognition.start();
          micBtn.classList.add('text-red-500', 'animate-pulse');
        });

        recognition.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          document.getElementById('query-input').value = transcript;
          micBtn.classList.remove('text-red-500', 'animate-pulse');
          processQuery(transcript);
        };

        recognition.onerror = () => {
          micBtn.classList.remove('text-red-500', 'animate-pulse');
        };
      }
    });
  </script>
</body>
</html>
