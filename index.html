<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AEGIS - Conversational AI with 3D Motion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">

  <header class="border-b border-slate-800 p-4 bg-slate-950/50 backdrop-blur">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-teal-400 bg-clip-text text-transparent">
        AEGIS Conversational Engine
      </h1>
      <span class="text-xs text-slate-400 font-mono">Status: Ready</span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
    
    <!-- Left Column: API Key & Chat Input -->
    <section class="lg:col-span-1 space-y-4">
      <!-- API Key Setup -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4">
        <label class="block text-xs font-semibold text-slate-300 mb-1 uppercase tracking-wider">Gemini API Key</label>
        <input id="api-key-input" type="password" placeholder="Paste AI Studio Key Here..." 
          class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-3 text-xs focus:outline-none focus:border-blue-500 text-slate-100">
      </div>

      <!-- Search Input -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4">
        <label class="block text-xs font-semibold text-slate-300 mb-2 uppercase tracking-wider">Ask Anything</label>
        <div class="relative flex items-center">
          <input id="query-input" type="text" placeholder="Ask a question or request a demo..." 
            class="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 pl-3 pr-10 text-sm focus:outline-none focus:border-blue-500 text-slate-100">
          <button id="mic-btn" title="Voice Input" class="absolute right-2 text-slate-400 hover:text-slate-200">
            🎤
          </button>
        </div>
        <button id="analyze-btn" class="w-full mt-3 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2 rounded-lg text-sm transition">
          Ask AI Engine
        </button>
      </div>

      <!-- Response Panel -->
      <div class="bg-slate-800/50 border border-slate-700/60 rounded-xl p-4">
        <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">AI Response</h2>
        <div id="analysis-summary" class="text-sm text-slate-300 space-y-1">
          <p class="text-slate-500 italic">Enter your question above to receive an open-ended response.</p>
        </div>
      </div>
    </section>

    <!-- Right Column: 3D Visualization Canvas & Code Output -->
    <section class="lg:col-span-2 space-y-4">
      <div class="bg-slate-950 border border-slate-800 rounded-xl h-80 relative overflow-hidden flex items-center justify-center">
        <div id="canvas-container" class="absolute inset-0"></div>
        <div class="absolute top-3 left-3 bg-slate-900/80 backdrop-blur px-2.5 py-1 rounded border border-slate-800 text-[11px] font-mono text-slate-400">
          Dynamic 3D Agent Demonstrator
        </div>
      </div>

      <div class="bg-slate-950 border border-slate-800 rounded-xl p-4">
        <div class="flex justify-between items-center mb-2">
          <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Engine Log / Code Context</span>
        </div>
        <pre class="bg-slate-900/80 p-3 rounded-lg overflow-x-auto text-xs font-mono text-blue-300 border border-slate-800/80"><code id="code-view">// Execution data will appear here...</code></pre>
      </div>
    </section>

  </main>

  <script>
    /* =========================================================================
       1. Three.js Scene Setup & Render Loop
       ========================================================================= */
    let scene, camera, renderer, agentMesh;
    let nodeMeshes = [], edgeLines = [];
    
    // Animation trajectory state
    let targetWaypoints = [];
    let currentTargetIndex = 0;
    let isAnimating = false;

    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 14, 16);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Create static grid platform
      buildBaseGrid();

      // Create 3D Agent Object (Glowing Cone)
      const agentGeo = new THREE.ConeGeometry(0.5, 1.2, 16);
      const agentMat = new THREE.MeshStandardMaterial({ 
        color: 0x38bdf8, 
        emissive: 0x0284c7, 
        emissiveIntensity: 0.8 
      });
      agentMesh = new THREE.Mesh(agentGeo, agentMat);
      agentMesh.rotation.x = Math.PI / 2;
      agentMesh.position.set(0, 0.6, 0);
      scene.add(agentMesh);

      // Frame loop for 60fps movement interpolation
      function animate() {
        requestAnimationFrame(animate);

        // Continuous agent spin
        if (agentMesh) {
          agentMesh.rotation.z += 0.03;
        }

        // Smooth Lerp movement along target path points
        if (isAnimating && targetWaypoints.length > 0) {
          const target = targetWaypoints[currentTargetIndex];
          const targetVec = new THREE.Vector3(target.x, target.y || 0.6, target.z);

          // Move 6% of remaining distance each frame
          agentMesh.position.lerp(targetVec, 0.06);

          // Advance to next waypoint upon reaching proximity
          if (agentMesh.position.distanceTo(targetVec) < 0.2) {
            currentTargetIndex++;
            if (currentTargetIndex >= targetWaypoints.length) {
              isAnimating = false; // Stop at end of path
            }
          }
        }

        renderer.render(scene, camera);
      }
      animate();
    }

    function buildBaseGrid() {
      const gridHelper = new THREE.GridHelper(20, 20, 0x3b82f6, 0x1e293b);
      gridHelper.position.y = 0;
      scene.add(gridHelper);
    }

    /* =========================================================================
       2. Open-Ended AI Integration via Google Gemini API
       ========================================================================= */
    async function processQuery(queryText) {
      const apiKey = document.getElementById('api-key-input').value.trim();
      const summaryContainer = document.getElementById('analysis-summary');
      const codeView = document.getElementById('code-view');

      if (!queryText.trim()) return;

      if (!apiKey) {
        summaryContainer.innerHTML = `<p class="text-red-400 font-semibold">Please paste your Gemini API key in the top input box first.</p>`;
        return;
      }

      summaryContainer.innerHTML = `<p class="text-blue-400 animate-pulse">Querying AI Engine & computing 3D motion trajectory...</p>`;

      const systemPrompt = `You are an AI assistant capable of answering open-ended questions. 
Respond in strict JSON format matching this schema:
{
  "answer": "Clear text answer to the user query",
  "codeSnippet": "Any relevant code snippet or pseudocode context",
  "path3D": [
    {"x": number, "y": 0.6, "z": number}
  ]
}
For path3D, provide 3 to 6 spatial coordinates within the bounds x: -8 to 8, z: -8 to 8 to visualize the dynamic state motion for this response.`;

      try {
     const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{
              parts: [{ text: `${systemPrompt}\n\nUser Question: ${queryText}` }]
            }],
            generationConfig: { responseMimeType: "application/json" }
          })
        });

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error.message);
        }

        const rawText = data.candidates[0].content.parts[0].text;
        const parsed = JSON.parse(rawText);

        // Update UI
        summaryContainer.innerHTML = `<p class="text-slate-200 text-xs leading-relaxed">${parsed.answer}</p>`;
        codeView.innerText = parsed.codeSnippet || "// No specific code generated.";

        // Trigger 3D Trajectory Animation
        if (parsed.path3D && Array.isArray(parsed.path3D)) {
          triggerAgentMotion(parsed.path3D);
        }

      } catch (err) {
        summaryContainer.innerHTML = `<p class="text-red-400 font-semibold">Error: ${err.message}</p>`;
      }
    }

    function triggerAgentMotion(waypoints) {
      targetWaypoints = waypoints;
      currentTargetIndex = 0;
      isAnimating = true;
    }

    /* =========================================================================
       3. Initialization & Event Handlers
       ========================================================================= */
    window.addEventListener('DOMContentLoaded', () => {
      init3D();

      document.getElementById('analyze-btn').addEventListener('click', () => {
        const query = document.getElementById('query-input').value;
        processQuery(query);
      });

      document.getElementById('query-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          processQuery(e.target.value);
        }
      });

      // Voice recognition integration
      const micBtn = document.getElementById('mic-btn');
      if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();

        micBtn.addEventListener('click', () => {
          recognition.start();
          micBtn.classList.add('text-red-500', 'animate-pulse');
        });

        recognition.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          document.getElementById('query-input').value = transcript;
          micBtn.classList.remove('text-red-500', 'animate-pulse');
          processQuery(transcript);
        };

        recognition.onerror = () => {
          micBtn.classList.remove('text-red-500', 'animate-pulse');
        };
      }
    });
  </script>
</body>
</html>
